<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d5a47" />
  <meta name="description" content="MyPropBook - Professional Property & Submeter Bill Management System. Automate rent and electricity billing for multiple properties." />
  <title>MyPropBook - Property & Bill Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  <style>
    /* Inline splash screen — eliminates the blue/white flash on refresh */
    body {
      margin: 0;
      background-color: #f1f5f3;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #mypropbook-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f3;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(16, 185, 129, 0.06), transparent),
        radial-gradient(ellipse 60% 40% at 100% 40%, rgba(20, 184, 166, 0.04), transparent);
      transition: opacity 0.3s ease-out;
    }
    #mypropbook-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: splashPulse 1.8s ease-in-out infinite;
    }
    .splash-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2d5a47;
    }
    .splash-icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .splash-text {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.8px;
    }
    .splash-bar {
      margin-top: 24px;
      width: 100px;
      height: 2.5px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .splash-bar-fill {
      height: 100%;
      width: 40%;
      background: #2d5a47;
      border-radius: 3px;
      animation: splashProgress 1.2s ease-in-out infinite alternate;
    }
    @keyframes splashPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    @keyframes splashProgress {
      0% { transform: translateX(-20px); }
      100% { transform: translateX(80px); }
    }
  </style>
</head>

<body>
  <!-- Branded splash screen — visible until React mounts -->
  <div id="mypropbook-splash">
    <div class="splash-logo">
      <div class="splash-icon">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 1-2.5-2.5z" />
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <line x1="8.5" y1="7" x2="14.5" y2="7" stroke-width="2" />
          <line x1="8.5" y1="11" x2="13" y2="11" stroke-width="2" />
        </svg>
      </div>
      <div>
        <div class="splash-text">MyPropBook</div>
      </div>
    </div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Fade out splash once React root renders content
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const splash = document.getElementById('mypropbook-splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(() => splash.remove(), 350);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
